<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Navy & Crimson</title>
</head>

<body>

    <div class="max-w-2xl mx-auto my-10 text-center shadow-lg rounded">

        <div class="bg-[#002642] py-4 rounded-t-lg">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-white tracking-wide">
                Welcome to Tailwind CSS
            </h1>
        </div>

        <div class="p-6 sm:p-8">

            <h2 class="text-xl sm:text-2xl md:text-3xl font-semibold text-[#002642]">
                Hey There! I'm Chhavi Bansal.
            </h2>

            <p class="mt-4 text-[#002642] leading-7">
                I'm pursuing my BCA degree at Dezyne E'cole College.
            </p>

            <form class="mt-8 space-y-4">

                <input
                    type="text"
                    placeholder="Enter Your Name"
                    class="w-full p-3 rounded-lg border border-[#840032] bg-white focus:outline-none focus:ring-2 focus:ring-[#840032] transition"
                >

                <button
                    class="w-full bg-[#840032] hover:bg-[#002642] text-white p-3 rounded-lg font-semibold shadow-md transition duration-300"
                >
                    Submit
                </button>

            </form>

            <p class="mt-6 text-[#840032]">
                "Thankyou for visiting my Tailwind assignment page!"
            </p>

        </div>
    </div>

</body>
</html>
